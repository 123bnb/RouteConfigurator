name: Build RouteConfigurator Rootless Deb
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 改用macOS运行器，自带Xcode编译环境，无需linux交叉工具链
    runs-on: macos-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装系统依赖+ldid签名工具
        run: |
          brew install make curl xz ldid

      - name: 克隆Theos
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: 下载 iPhoneOS15.6 SDK
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS/sdks
          mkdir -p $THEOS/sdks
          curl -L -o sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS15.6.sdk.tar.xz
          tar -xf sdk.tar.xz -C $THEOS/sdks/
          rm -f sdk.tar.xz

      - name: 编译 rootless 插件
        run: |
          export THEOS=$HOME/theos
          make package NO_CLEAN=1

      - name: 上传deb安装包
        uses: actions/upload-artifact@v4
        with:
          path: ./packages/*.deb
          name: RouteConfigurator-Deb
