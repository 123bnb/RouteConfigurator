name: Build RouteConfigurator Rootless Deb
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y git make curl libxml2-dev zip unzip clang lld xz-utils

      - name: 安装 Theos 稳定版
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: 下载官方 iPhoneOS16.5 SDK tar包，兼容16.0
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS/sdks
          mkdir -p $THEOS/sdks
          curl -L -o sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf sdk.tar.xz -C $THEOS/sdks/
          rm -f sdk.tar.xz
          cp -r $THEOS/sdks/iPhoneOS16.5.sdk $THEOS/sdks/iPhoneOS16.0.sdk

      - name: 编译 rootless 插件（跳过make clean）
        run: |
          export THEOS=$HOME/theos
          make package THEOS_PACKAGE_SCHEME=rootless NO_CLEAN=1

      - name: 上传deb安装包
        uses: actions/upload-artifact@v4
        with:
          path: ./packages/*.deb
          name: RouteConfigurator-Rootless-Deb
