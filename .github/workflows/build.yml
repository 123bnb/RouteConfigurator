name: Build RouteConfigurator Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Theos
        uses: op3ns0urce/theos-setup-action@v1
        with:
          sdk: iPhoneOS16.0.sdk

      - name: Build Tweak
        run: make package THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: RouteConfigurator-Deb
          path: packages/*.deb
