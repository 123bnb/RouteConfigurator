name: Build RouteConfigurator Rootless Deb
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git make curl libxml2-dev zip unzip xz-utils

      # 固定克隆theos，改用新版工具链安装命令（之前脚本改名）
      - name: Clone Theos & install Linux toolchain
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          cd $THEOS
          # 新版脚本文件名：install-linux-toolchain
          ./bin/install-linux-toolchain
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Download iPhoneOS15.6 SDK
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS/sdks
          mkdir -p $THEOS/sdks
          curl -L -o sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS15.6.sdk.tar.xz
          tar -xf sdk.tar.xz -C $THEOS/sdks/
          rm -f sdk.tar.xz

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          make package NO_CLEAN=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: ./packages/*.deb
          name: RouteConfigurator-Deb
