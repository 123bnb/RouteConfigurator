name: Build RouteConfigurator
on:
  workflow_dispatch:
  push:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install basic build tools
        run: |
          sudo apt update
          sudo apt install -y git make clang perl dpkg-dev

      - name: Setup Theos & SDK
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          # 拉取theos主库含子模块
          git clone --recursive https://github.com/theos/theos.git $THEOS
          # 固定可用ldid下载地址，修复404
          wget https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid-linux-x86_64 -O $THEOS/bin/ldid
          chmod +x $THEOS/bin/ldid
          # 拉取完整SDK库
          git clone https://github.com/theos/sdks.git $THEOS/sdks

      - name: Build rootless deb
        run: make package THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteConfigurator-deb
          path: packages/*.deb
