name: Build RouteConfigurator Rootless Deb
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y git make curl libxml2-dev zip unzip clang lld xz-utils

      # 官方稳定Action，自动装好theos+linux交叉编译工具链，无404、无脚本报错
      - name: Setup Theos Linux
        uses: theos/setup-theos@v1
        with:
          platform: linux

      - name: 下载 iPhoneOS15.6 SDK
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS/sdks
          mkdir -p $THEOS/sdks
          curl -L -o sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS15.6.sdk.tar.xz
          tar -xf sdk.tar.xz -C $THEOS/sdks/
          rm -f sdk.tar.xz

      - name: 编译 rootless 插件
        run: |
          export THEOS=$HOME/theos
          make package NO_CLEAN=1

      - name: 上传deb包
        uses: actions/upload-artifact@v4
        with:
          path: ./packages/*.deb
          name: RouteConfigurator-Rootless-Deb
