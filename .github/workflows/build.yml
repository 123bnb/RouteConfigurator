name: Build RouteConfigurator
on:
  workflow_dispatch:
  push:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 手动安装完整Theos环境
      - name: Install Theos manually
        run: |
          sudo apt update
          sudo apt install -y git make clang ldid perl dpkg-dev
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          # 下载14.4 SDK（匹配原Makefile）
          git clone https://github.com/theos/sdks.git $THEOS/sdks

      # 编译打包，不使用make clean
      - name: Build deb
        run: make package THEOS_PACKAGE_SCHEME=rootless

      - name: Download deb
        uses: actions/upload-artifact@v4
        with:
          name: RouteConfigurator-deb
          path: packages/*.deb
